<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinewood Recap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='recap.css') }}"
    />
    <script>
      if (new URLSearchParams(location.search).get("iosapp") === "1") {
        document.documentElement.classList.add("iosapp");
      }
    </script>
  </head>
  <body>
    <div class="recap-bg">
      <div>
        <!-- <p>Not in recap container</p> -->
      </div>
    </div>
    <div class="recap-container" style="display: none;">
      <div class="slides">
        <div class="slide-base" id="slide-gen">
          <h1>Generating...</h1>
        </div>
      </div>
    </div>
    <div class="recap-container" id="main-recap-container" style="">
      <a id="home-btn" href="/" aria-label="Home" title="Back to home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
      </a>
      <button id="download-btn" aria-label="Download slide" title="Download this slide" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>
        </svg>
      </button>
      <div class="slides">
        <div class="slide-base" id="slide1">
          <div class="photos-album-selection-scroll"></div>
          <div class="slide-1-hero">
            <h1 id="txt-to-fade-in">Your Recap</h1>
            <p>
              By the
              <a href="https://techclub.pw" target="_blank"
                ><span class="txt-em cas-bounce">Pinewood Tech Club</span></a
              >
            </p>
            <p style="opacity: 1" id="do-the-fade-in-thing">
              Click/tap to proceed, use arrow keys/swipe for navigation.
            </p>
          </div>
        </div>
        <div class="slide-base" id="slide2" style="display: none">
          <div class="s2cont">
            <div>
              <div class="nc-sizer">
                <p class="for2subtxt bare-reveal-text" id="s2-p-completed">
                  <span id="s2-you-completed"></span>
                </p>
              </div>
              <div class="s2-count-container">
                <div class="s2-graph-paper-bg"></div>
                <img
                  class="s2-clip-full"
                  src="{{ url_for('static', filename='imag/clip/clip_full.png') }}"
                  alt=""
                />
                <h1 id="s2-count" style="visibility: hidden">0</h1>
                <img
                  class="s2-clip-top"
                  src="{{ url_for('static', filename='imag/clip/clip_top.png') }}"
                  alt=""
                />
              </div>
              <div class="nc-sizer">
                <p class="for2subtxt bare-reveal-text" id="s2-p-assignments">
                  <span id="s2-assignments-text"></span>
                </p>
              </div>
              <div class="nc-sizer">
                <p
                  class="for2subtxt bare-reveal-text"
                  id="s2-p-top3intro"
                >
                  <span id="s2-top3-intro"></span>
                </p>
              </div>
              <div id="s2-top3" style="display: none"></div>
            </div>
          </div>
        </div>
        <div class="slide-base" id="slide3" style="display: none">
          <div class="s2cont">
            <div>
              <div class="nc-sizer">
                <p class="for2stat2 bare-reveal-text" id="s2-p-month">
                  <span id="s2-m-intro"></span
                  ><b class="val-primary" id="s2-month-name"></b
                  ><span id="s2-m-mid"></span
                  ><b class="val-secondary" id="s2-month-count"></b
                  ><span id="s2-m-outro"></span>
                </p>
              </div>
              <div class="nc-sizer">
                <p class="for2stat2 bare-reveal-text" id="s2-p-day">
                  <span id="s2-d-intro"></span
                  ><b class="val-primary" id="s2-day-name"></b
                  ><span id="s2-d-mid"></span
                  ><b class="val-secondary" id="s2-day-count"></b
                  ><span id="s2-d-outro"></span>
                </p>
              </div>
              <div
                class="gh-contr-graph"
                id="s2-graph"
                style="opacity: 0; transform: translateY(8vh)"
              ></div>
              <div class="gh-contr-graph-info" id="s2-graph-info">
                <p>Click/tap/drag on graph to view more info about a day</p>
              </div>
            </div>
          </div>
        </div>
        <div id="slide4" class="slide-base" style="display: none"></div>
      </div>
    </div>
  </body>
  <script>
    const RECAP_ID = {{ recap_id | tojson }};
    const IS_GENERATING = {{ is_generating | tojson }};
  </script>
  <script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="{{ url_for('static', filename='js/recap.js') }}"></script>
</html>
